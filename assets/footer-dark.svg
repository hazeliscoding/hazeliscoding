<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc"><title id="title">Hazel's developer profile</title><desc id="desc">PC-98-inspired desktop artwork with a gently blinking terminal cursor and floating stars.</desc><style>text{font-family:Consolas,'DejaVu Sans Mono',monospace}.cursor{animation:blink 1.2s steps(1,end) infinite}.star{animation:twinkle 4s ease-in-out infinite}.star2{animation:twinkle 5s ease-in-out 1.5s infinite}@keyframes blink{50%{opacity:0}}@keyframes twinkle{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.cursor,.star,.star2{animation:none!important}}</style><rect width="1200" height="285" rx="16" fill="#171a2a"/><rect x="18" y="18" width="1164" height="249" rx="10" fill="#25253a" stroke="#765a86" stroke-width="2"/><rect x="18" y="18" width="1164" height="40" rx="10" fill="#765a86"/><rect x="18" y="48" width="1164" height="10" fill="#765a86"/><circle cx="44" cy="38" r="7" fill="#f7b3cb"/><circle cx="67" cy="38" r="7" fill="#e9d3a6"/><circle cx="90" cy="38" r="7" fill="#a9dfcf"/><text x="115" y="43" font-size="18" fill="#171a2a">HAZEL.EXE  /  PERSONAL TERMINAL</text><text x="70" y="113" font-size="21" fill="#e5a1ca">SYSTEM MESSAGE  /  THANK YOU FOR VISITING</text><text x="70" y="176" font-size="38" font-weight="bold" fill="#fff2fa">Make something weird &amp; wonderful.</text><text x="70" y="224" font-size="23" fill="#bdb2d0">Take breaks. Document the bugs. Share what you learn. ♡</text><text class="star" x="1035" y="242" font-size="56" fill="#e8b4df">✿</text></svg>