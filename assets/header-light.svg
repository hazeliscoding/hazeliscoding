<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Hazel's developer profile</title><desc id="desc">PC-98-inspired desktop artwork with a gently blinking terminal cursor and floating stars.</desc><style>text{font-family:Consolas,'DejaVu Sans Mono',monospace}.cursor{animation:blink 1.2s steps(1,end) infinite}.star{animation:twinkle 4s ease-in-out infinite}.star2{animation:twinkle 5s ease-in-out 1.5s infinite}@keyframes blink{50%{fill-opacity:0}}@keyframes twinkle{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.cursor,.star,.star2{animation:none!important}}</style><rect width="1200" height="320" rx="16" fill="#fff8fc"/><rect x="18" y="18" width="1164" height="284" rx="10" fill="#f4e9f2" stroke="#c7a9cd" stroke-width="2"/><rect x="18" y="18" width="1164" height="40" rx="10" fill="#c7a9cd"/><rect x="18" y="48" width="1164" height="10" fill="#c7a9cd"/><circle cx="44" cy="38" r="7" fill="#f7b3cb"/><circle cx="67" cy="38" r="7" fill="#e9d3a6"/><circle cx="90" cy="38" r="7" fill="#a9dfcf"/><text x="115" y="43" font-size="18" fill="#fff8fc">HAZEL.EXE  /  PERSONAL TERMINAL</text><text x="70" y="112" font-size="19" fill="#e7a6ca">✦ WELCOME TO MY LITTLE CORNER OF GITHUB</text><text x="70" y="183" font-size="57" font-weight="bold" fill="#382a45">Hi, I'm Hazel~!</text><text x="70" y="225" font-size="24" fill="#695e78">.NET developer  •  AI engineer  •  OSS maker</text><text x="70" y="274" font-size="20" fill="#91cfb8">~/hazel $</text><text x="212" y="274" font-size="20" fill="#382a45">building things &amp; proving they work<tspan class="cursor" fill="#eab2d6">█</tspan></text><text class="star" x="1040" y="153" font-size="45" fill="#edb4d9">✦</text><text class="star2" x="994" y="220" font-size="27" fill="#9cd2d7">✧</text><text class="star" x="1094" y="254" font-size="20" fill="#d0afe8">✦</text></svg>