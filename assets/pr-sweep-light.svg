<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Hazel's developer profile</title><desc id="desc">PC-98-inspired desktop artwork with a gently blinking terminal cursor and floating stars.</desc><style>text{font-family:Consolas,'DejaVu Sans Mono',monospace}.cursor{animation:blink 1.2s steps(1,end) infinite}.star{animation:twinkle 4s ease-in-out infinite}.star2{animation:twinkle 5s ease-in-out 1.5s infinite}@keyframes blink{50%{opacity:0}}@keyframes twinkle{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.cursor,.star,.star2{animation:none!important}}</style><rect width="1200" height="320" rx="16" fill="#fff8fc"/><rect x="18" y="18" width="1164" height="284" rx="10" fill="#f4e9f2" stroke="#c7a9cd" stroke-width="2"/><rect x="18" y="18" width="1164" height="40" rx="10" fill="#c7a9cd"/><rect x="18" y="48" width="1164" height="10" fill="#c7a9cd"/><circle cx="44" cy="38" r="7" fill="#f7b3cb"/><circle cx="67" cy="38" r="7" fill="#e9d3a6"/><circle cx="90" cy="38" r="7" fill="#a9dfcf"/><text x="115" y="43" font-size="18" fill="#fff8fc">HAZEL.EXE  /  PERSONAL TERMINAL</text><text x="75" y="121" font-size="22" fill="#f59dbe">FILE 03 / FEATURED PROJECT</text><text x="75" y="190" font-size="52" font-weight="bold" fill="#382a45">PR SWEEP</text><text x="75" y="238" font-size="26" fill="#695e78">Make your review queue make sense</text><text x="75" y="282" font-size="19" fill="#f59dbe">Angular  /  Electron  /  TypeScript</text><rect x="1035" y="104" width="85" height="85" rx="15" fill="#f59dbe" opacity=".17"/><text x="1057" y="163" font-size="44" fill="#f59dbe">✦</text></svg>