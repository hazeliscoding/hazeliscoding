      x="320"
      y="240"
      width="260"
      height="108"
      rx="14"
      fill="url(#cardGradient)"
      stroke="#30363d"
    />
    <!-- Glass overlay -->
    <rect
      x="320"
      y="240"
      width="260"
      height="108"
      rx="14"
