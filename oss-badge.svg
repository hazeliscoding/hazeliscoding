      y="330"
      fill="#8b949e"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="12"
      letter-spacing="0em">⭐ 21.0K · 2 PRs Merged</text>
  </g>
  
  
  
  
  
  <g>
    <!-- Card background -->
