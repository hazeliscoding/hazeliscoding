    />
    <!-- Repo name -->
    <text
      x="336"
      y="272"
      fill="#e6edf3"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="16"
      font-weight="bold"
	  class="repo-name"
      letter-spacing="0em">Blogging-Platform-Project</text>
    <!-- Owner -->
    <text
      x="336"
      y="290"
      fill="#8b949e"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="12"
      letter-spacing="0em">@WillowPrograms</text>
    <!-- Stats -->
    <text
      x="336"
      y="330"
      fill="#8b949e"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="12"
      letter-spacing="0em">⭐ 0 · 2 PRs Merged</text>
  </g>
  
  
  
  
  
  <g>
    <!-- Card background -->
    <rect
      x="608"
      y="240"
      width="260"
      height="108"
      rx="14"
      fill="url(#cardGradient)"
      stroke="#30363d"
    />
    <!-- Glass overlay -->
    <rect
      x="608"
      y="240"
      width="260"
      height="108"
      rx="14"
