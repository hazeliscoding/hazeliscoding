
<svg
  width="900"
  height="398"
  viewBox="0 0 900 398"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="GitHub Open Source Contribution Stats">

  <defs>
    <!-- Card gradient (solid fill with opacity) -->
    <linearGradient id="cardGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glass overlay gradient -->
    <linearGradient id="glassOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ========================= -->
  <!-- Background -->
  <!-- ========================= -->
  <rect
    width="900"
    height="398"
    rx="18"
    fill="#101820"
  />

  <!-- ========================= -->
  <!-- Header -->
  <!-- ========================= -->
  <text
    x="33"
    y="49"
    fill="#e6edf3"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="26"
    font-weight="bold"
    letter-spacing="0em">hazeliscoding · Open Source Contributions</text>

  <!-- ========================= -->
  <!-- Metrics Row -->
  <!-- ========================= -->

  <!-- Projects Card -->
  <g>
    <rect x="32" y="96" width="260" height="96" rx="14" fill="url(#cardGradient)" stroke="#30363d"/>
    <rect x="32" y="96" width="260" height="96" rx="14" fill="url(#glassOverlay)"/>
    <text
      x="48"
      y="132"
      fill="#8b949e"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="12"
      letter-spacing="0em">PROJECTS</text>
    <text
      x="48"
      y="167"
      fill="#e6edf3"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="28"
      font-weight="bold"
      letter-spacing="0em">3</text>
  </g>

  <!-- PRs Merged Card -->
  <g>
    <rect x="320" y="96" width="260" height="96" rx="14" fill="url(#cardGradient)" stroke="#30363d"/>
    <rect x="320" y="96" width="260" height="96" rx="14" fill="url(#glassOverlay)"/>
    <text
      x="336"
      y="132"
      fill="#8b949e"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="12"
      letter-spacing="0em">PRS MERGED</text>
    <text
      x="336"
      y="167"
      fill="#e6edf3"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="28"
      font-weight="bold"
      letter-spacing="0em">5</text>
  </g>

  <!-- Lines Changed Card -->
  <g>
    <rect x="608" y="96" width="260" height="96" rx="14" fill="url(#cardGradient)" stroke="#30363d"/>
    <rect x="608" y="96" width="260" height="96" rx="14" fill="url(#glassOverlay)"/>
    <text
      x="624"
      y="132"
      fill="#8b949e"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="12"
      letter-spacing="0em">LINES CHANGED</text>
    <text
      x="624"
      y="167"
      fill="#e6edf3"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="28"
      font-weight="bold"
      letter-spacing="0em">13.2K</text>
  </g>

  <!-- ========================= -->
  <!-- Top Contributions -->
  <!-- ========================= -->
  <text
    x="32"
    y="224"
    fill="#8b949e"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="13"
    letter-spacing="0em">Top Contributions</text>

  
  
  
  
  
  <g>
    <!-- Card background -->
